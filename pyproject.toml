[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nass3cp"
version = "0.1.0"
description = "Copy files to and from a NAS through an S3-compatible relay"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-2.0-only" }
authors = [{ name = "nass3cp contributors" }]
dependencies = []

[project.scripts]
nass3cp = "nass3cp.cli:main"
nass3cp-server = "nass3cp.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

